name: milestone-tracker
description: Record and verify sprint milestone submission deliverables.
input_schema:
  type: object
  properties:
    sprint_id:
      type: string
      description: Identifier for the active challenge sprint.
    milestone_number:
      type: integer
      description: Milestone index (1 to 4).
    submission_link:
      type: string
      description: Link to pull request, document, or demo recording.
  required:
    - sprint_id
    - milestone_number
    - submission_link
